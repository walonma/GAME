services:
  # Strict four-real-players version - no "fill with bots" option at all.
  - type: web
    name: taiwan-mahjong-4p
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node packages/server/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: ALLOW_BOTS
        value: "false"
      - key: VITE_ALLOW_BOTS
        value: "false"

  # 2-4 players version - empty seats can be filled with computer-controlled bots.
  - type: web
    name: taiwan-mahjong-2p
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node packages/server/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: ALLOW_BOTS
        value: "true"
      - key: VITE_ALLOW_BOTS
        value: "true"
